steps:
  # 1. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/cost-code-tracker:$COMMIT_SHA', '.']
    
  # 2. Push the container image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/cost-code-tracker:$COMMIT_SHA']
    
  # 3. Deploy the container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'cost-code-tracker'
      - '--image'
      - 'gcr.io/$PROJECT_ID/cost-code-tracker:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      # We don't need to specify secrets here because Cloud Run preserves existing configurations (like our Secret Manager mounts) when deploying a new image!

images:
  - 'gcr.io/$PROJECT_ID/cost-code-tracker:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
